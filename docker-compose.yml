services:
  labcontrol.api:
    image: ${DOCKER_REGISTRY-}labcontrolapi
    container_name: labcontrol_api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=labcontroldb;Username=admin;Password=admin
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Mqtt__Host=mosquitto
      - Mqtt__Port=1883
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mosquitto
    networks:
      - labcontrol-network

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: labcontrol_mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - labcontrol-network

  postgres:
    image: postgres:15
    container_name: labcontrol_db
    restart: always
    environment:
      POSTGRES_DB: labcontroldb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    networks:
      - labcontrol-network

networks:
  labcontrol-network:
    external: true