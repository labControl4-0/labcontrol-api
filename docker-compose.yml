version: '3.9'

services:
  labcontrol.api:
    image: ${DOCKER_REGISTRY-}labcontrolapi
    container_name: labcontrol_api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=labcontroldb;Username=admin;Password=admin
      - Gemini__ApiKey=${GEMINI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - labcontrol-network

  postgres:
    image: postgres:15
    container_name: labcontrol_db
    restart: always
    environment:
      POSTGRES_DB: labcontroldb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    networks:
      - labcontrol-network

networks:
  labcontrol-network:
    external: true